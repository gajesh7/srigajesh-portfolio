<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
    <linearGradient id="chartGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg3)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <path d="M0 100H1200 M0 200H1200 M0 300H1200 M0 400H1200 M0 500H1200 M0 600H1200 M0 700H1200" />
    <path d="M150 0V800 M300 0V800 M450 0V800 M600 0V800 M750 0V800 M900 0V800 M1050 0V800" />
  </g>

  <!-- Glowing Radial Background Orbs -->
  <circle cx="900" cy="250" r="300" fill="#3B82F6" opacity="0.12" filter="blur(80px)" />
  <circle cx="300" cy="600" r="250" fill="#8B5CF6" opacity="0.1" filter="blur(70px)" />

  <!-- UI Window Container Mockup -->
  <g transform="translate(100, 100)">
    <!-- Dashboard Card Shadow & Frame -->
    <rect width="1000" height="600" rx="20" fill="#151D2A" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect width="1000" height="50" rx="20" fill="#1E293B"/>
    <circle cx="30" cy="25" r="6" fill="#EF4444"/>
    <circle cx="50" cy="25" r="6" fill="#F59E0B"/>
    <circle cx="70" cy="25" r="6" fill="#10B981"/>
    <text x="500" y="30" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">eprise.app / financial-analytics-v2</text>

    <!-- Sidebar -->
    <rect x="0" y="50" width="220" height="550" fill="#0F172A" opacity="0.8"/>
    <text x="30" y="100" fill="#60A5FA" font-family="sans-serif" font-size="16" font-weight="800" letter-spacing="2">ePRISE</text>
    
    <rect x="20" y="130" width="180" height="36" rx="8" fill="#1E293B"/>
    <text x="45" y="153" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Analytics Overview</text>
    <text x="45" y="203" fill="#64748B" font-family="sans-serif" font-size="13" font-weight="600">GST Reconciliation</text>
    <text x="45" y="243" fill="#64748B" font-family="sans-serif" font-size="13" font-weight="600">Invoices &amp; Billing</text>
    <text x="45" y="283" fill="#64748B" font-family="sans-serif" font-size="13" font-weight="600">Smart Ledger</text>

    <!-- Main Dashboard Metrics -->
    <!-- Metric 1 -->
    <g transform="translate(250, 80)">
      <rect width="220" height="100" rx="14" fill="#1E293B" stroke="rgba(255,255,255,0.05)"/>
      <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">NET REVENUE Q3</text>
      <text x="20" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="24" font-weight="800">₹42,85,000</text>
      <text x="20" y="85" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700">↑ +18.4% vs last mo</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(490, 80)">
      <rect width="220" height="100" rx="14" fill="#1E293B" stroke="rgba(255,255,255,0.05)"/>
      <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">AUTO MATCHED GST</text>
      <text x="20" y="65" fill="#60A5FA" font-family="sans-serif" font-size="24" font-weight="800">99.2%</text>
      <text x="20" y="85" fill="#3B82F6" font-family="sans-serif" font-size="11" font-weight="700">Instant reconciliation</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(730, 80)">
      <rect width="230" height="100" rx="14" fill="#1E293B" stroke="rgba(255,255,255,0.05)"/>
      <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">PENDING ITC CREDIT</text>
      <text x="20" y="65" fill="#F59E0B" font-family="sans-serif" font-size="24" font-weight="800">₹1,24,500</text>
      <text x="20" y="85" fill="#F59E0B" font-family="sans-serif" font-size="11" font-weight="700">3 Actions required</text>
    </g>

    <!-- Large Area Chart -->
    <g transform="translate(250, 210)">
      <rect width="710" height="340" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.05)"/>
      <text x="25" y="35" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Cash Flow &amp; Tax Trajectory</text>
      
      <!-- Chart Area Fill -->
      <path d="M30 270 C 120 220, 200 250, 300 160 C 400 70, 500 180, 600 100 C 650 60, 680 80, 680 80 L 680 270 Z" fill="url(#chartGlow)" />
      <!-- Chart Line -->
      <path d="M30 270 C 120 220, 200 250, 300 160 C 400 70, 500 180, 600 100 C 650 60, 680 80, 680 80" fill="none" stroke="url(#accentLine)" stroke-width="4" stroke-linecap="round" />

      <!-- Glowing Pulse Points -->
      <circle cx="300" cy="160" r="6" fill="#60A5FA" />
      <circle cx="600" cy="100" r="6" fill="#A855F7" />
    </g>
  </g>
</svg>

