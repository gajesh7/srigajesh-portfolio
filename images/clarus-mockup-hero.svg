<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="clarusStudioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14110E"/>
      <stop offset="50%" stop-color="#1F1A14"/>
      <stop offset="100%" stop-color="#0D0B09"/>
    </linearGradient>
    <radialGradient id="clarusCopperGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8C5528" stop-opacity="0.0"/>
    </radialGradient>
    <filter id="clarusShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#D97706" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="pcbHeroMesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1612"/>
      <stop offset="100%" stop-color="#0F0D0B"/>
    </linearGradient>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Syne', 'Space Grotesk', 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .font-body { font-family: -apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Studio Stage Background -->
  <rect width="1600" height="1000" fill="url(#clarusStudioBg)"/>
  <rect width="1600" height="1000" fill="url(#clarusCopperGlow)"/>

  <!-- Enterprise Hardware Frame (1440 x 880) -->
  <g transform="translate(80, 60)" filter="url(#clarusShadow)">
    <rect width="1440" height="880" rx="22" fill="#14110F" stroke="rgba(217, 119, 6, 0.3)" stroke-width="1.5"/>
    
    <!-- Chrome Header -->
    <path d="M 0 22 Q 0 0 22 0 L 1418 0 Q 1440 0 1440 22 L 1440 48 L 0 48 Z" fill="#1A1714"/>
    <line x1="0" y1="48" x2="1440" y2="48" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <circle cx="32" cy="24" r="6" fill="#FF5F56"/>
    <circle cx="52" cy="24" r="6" fill="#FFBD2E"/>
    <circle cx="72" cy="24" r="6" fill="#27C93F"/>
    
    <rect x="440" y="10" width="560" height="28" rx="14" fill="#0F0D0B" stroke="rgba(217, 119, 6, 0.2)" stroke-width="1"/>
    <text x="720" y="28" class="font-body" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">clarusdigitronics.com — Electronics Manufacturing &amp; PCB Assembly</text>

    <!-- Page Body (1440 x 832) -->
    <g transform="translate(0, 48)">
      
      <!-- Top Website Nav (Height 70) -->
      <rect width="1440" height="70" fill="#120F0D"/>
      <line x1="0" y1="70" x2="1440" y2="70" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
      
      <!-- Clarus Logo -->
      <g transform="translate(50, 22)">
        <rect width="26" height="26" rx="6" fill="#D97706"/>
        <text x="13" y="18" class="font-title" font-size="15" font-weight="900" fill="#000000" text-anchor="middle">C</text>
        <text x="38" y="20" class="font-title" font-size="19" font-weight="800" fill="#FAF5F0" letter-spacing="0.06em">CLARUS</text>
        <text x="122" y="20" class="font-title" font-size="19" font-weight="400" fill="#D97706" letter-spacing="0.06em">DIGITRONICS</text>
      </g>

      <!-- Nav Links -->
      <g transform="translate(540, 40)" class="font-body" font-size="13" font-weight="600" fill="#A8A29E">
        <text x="0" y="0" fill="#D97706" font-weight="700">Capabilities</text>
        <text x="100" y="0">SMT Assembly</text>
        <text x="210" y="0">Plastic Moulding</text>
        <text x="340" y="0">Testing &amp; QA</text>
        <text x="450" y="0">About</text>
        <text x="520" y="0">Contact</text>
      </g>

      <!-- Request Quote Button -->
      <g transform="translate(1260, 16)">
        <rect width="130" height="38" rx="8" fill="#D97706"/>
        <text x="65" y="24" class="font-body" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Request Quote →</text>
      </g>

      <!-- HERO SECTION -->
      <g transform="translate(0, 70)">
        <rect width="1440" height="470" fill="url(#pcbHeroMesh)"/>
        
        <!-- Subtle Circuit Traces in Background -->
        <path d="M 0 200 L 200 200 L 260 260 L 600 260" stroke="rgba(217, 119, 6, 0.15)" stroke-width="1.5" fill="none"/>
        <path d="M 800 120 L 1100 120 L 1160 180 L 1440 180" stroke="rgba(217, 119, 6, 0.15)" stroke-width="1.5" fill="none"/>
        <circle cx="260" cy="260" r="3" fill="#D97706" opacity="0.4"/>
        <circle cx="1160" cy="180" r="3" fill="#D97706" opacity="0.4"/>

        <!-- Center Hero Headline Block -->
        <g transform="translate(120, 60)">
          
          <!-- Eyebrow -->
          <rect width="240" height="28" rx="14" fill="rgba(217, 119, 6, 0.15)" stroke="rgba(217, 119, 6, 0.4)" stroke-width="1"/>
          <circle cx="14" cy="14" r="4" fill="#D97706"/>
          <text x="26" y="18" class="font-body" font-size="11" font-weight="700" fill="#D97706" letter-spacing="0.08em">PRECISION ELECTRONICS EMS</text>

          <!-- Main Title -->
          <text x="0" y="78" class="font-title" font-size="44" font-weight="800" fill="#FFFFFF">Precision-Engineered</text>
          <text x="0" y="132" class="font-title" font-size="44" font-weight="800" fill="#FFFFFF">Electronics Manufacturing <tspan fill="#D97706">at Scale</tspan></text>

          <!-- Subhead -->
          <text x="0" y="180" class="font-body" font-size="16" font-weight="400" fill="#A8A29E">
            Full-lifecycle contract manufacturing from rapid NPI prototyping to high-volume PCB assembly,
          </text>
          <text x="0" y="206" class="font-body" font-size="16" font-weight="400" fill="#A8A29E">
            precision injection moulding, box build assembly, and automated zero-defect validation.
          </text>

          <!-- Action Buttons -->
          <g transform="translate(0, 250)">
            <rect width="190" height="48" rx="8" fill="#D97706"/>
            <text x="95" y="29" class="font-body" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Get Production Quote</text>

            <rect x="206" y="0" width="180" height="48" rx="8" fill="transparent" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
            <text x="296" y="29" class="font-body" font-size="14" font-weight="700" fill="#FAF5F0" text-anchor="middle">Facility Virtual Tour</text>
          </g>

        </g>

        <!-- Right Side: Technical Specs Card -->
        <g transform="translate(940, 50)">
          <rect width="420" height="350" rx="16" fill="#171310" stroke="rgba(217, 119, 6, 0.25)" stroke-width="1.5"/>
          <text x="28" y="40" class="font-title" font-size="18" font-weight="800" fill="#FAF5F0">Manufacturing Capabilities</text>
          
          <!-- Spec Row 1 -->
          <g transform="translate(28, 70)">
            <text x="0" y="16" class="font-body" font-size="13" font-weight="700" fill="#D97706">High-Speed SMT Lines</text>
            <text x="0" y="36" class="font-body" font-size="12" fill="#A8A29E">0201 chip components, BGA &amp; QFN fine-pitch placement</text>
          </g>
          <line x1="28" y1="130" x2="392" y2="130" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

          <!-- Spec Row 2 -->
          <g transform="translate(28, 150)">
            <text x="0" y="16" class="font-body" font-size="13" font-weight="700" fill="#D97706">Precision Plastic Moulding</text>
            <text x="0" y="36" class="font-body" font-size="12" fill="#A8A29E">High-tonnage electric injection moulds &amp; tight tolerances</text>
          </g>
          <line x1="28" y1="210" x2="392" y2="210" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

          <!-- Spec Row 3 -->
          <g transform="translate(28, 230)">
            <text x="0" y="16" class="font-body" font-size="13" font-weight="700" fill="#D97706">Zero-Defect Quality Assurance</text>
            <text x="0" y="36" class="font-body" font-size="12" fill="#A8A29E">3D Automated Optical Inspection (AOI), X-Ray, ICT</text>
          </g>
        </g>

      </g>

      <!-- BOTTOM METRICS BAR (Height 170) -->
      <g transform="translate(0, 540)">
        <rect width="1440" height="170" fill="#0D0B0A" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
        
        <g transform="translate(100, 50)">
          <text x="0" y="32" class="font-title" font-size="36" font-weight="800" fill="#D97706">3.5M+</text>
          <text x="0" y="58" class="font-body" font-size="13" font-weight="700" fill="#FAF5F0">SMT Components Placed</text>
          <text x="0" y="78" class="font-body" font-size="12" fill="#78716C">High-speed lines monthly</text>
        </g>

        <line x1="390" y1="40" x2="390" y2="130" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

        <g transform="translate(440, 50)">
          <text x="0" y="32" class="font-title" font-size="36" font-weight="800" fill="#D97706">9M+</text>
          <text x="0" y="58" class="font-body" font-size="13" font-weight="700" fill="#FAF5F0">Products Tested</text>
          <text x="0" y="78" class="font-body" font-size="12" fill="#78716C">Zero-defect validation</text>
        </g>

        <line x1="730" y1="40" x2="730" y2="130" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

        <g transform="translate(780, 50)">
          <text x="0" y="32" class="font-title" font-size="36" font-weight="800" fill="#D97706">2.7M+</text>
          <text x="0" y="58" class="font-body" font-size="13" font-weight="700" fill="#FAF5F0">Moulded Parts</text>
          <text x="0" y="78" class="font-body" font-size="12" fill="#78716C">High-tolerance enclosures</text>
        </g>

        <line x1="1070" y1="40" x2="1070" y2="130" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

        <g transform="translate(1120, 50)">
          <text x="0" y="32" class="font-title" font-size="36" font-weight="800" fill="#D97706">110K+</text>
          <text x="0" y="58" class="font-body" font-size="13" font-weight="700" fill="#FAF5F0">Production Hours</text>
          <text x="0" y="78" class="font-body" font-size="12" fill="#78716C">Automated industrial floor</text>
        </g>

      </g>

    </g>

  </g>
</svg>