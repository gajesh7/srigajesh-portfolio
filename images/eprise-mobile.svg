<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="mobBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#mobBg)"/>

  <!-- Background Lines -->
  <g stroke="rgba(255,255,255,0.02)" stroke-width="1">
    <path d="M0 100H1200 M0 200H1200 M0 300H1200 M0 400H1200 M0 500H1200 M0 600H1200 M0 700H1200"/>
    <path d="M150 0V800 M300 0V800 M450 0V800 M600 0V800 M750 0V800 M900 0V800 M1050 0V800"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="360" cy="400" r="280" fill="#3B82F6" opacity="0.12" filter="blur(80px)"/>
  <circle cx="840" cy="400" r="280" fill="#8B5CF6" opacity="0.1" filter="blur(80px)"/>

  <!-- PHONE 1: LEFT (Dashboard & Daily Overview) -->
  <g transform="translate(200, 60)" filter="url(#phoneShadow)">
    <!-- Outer Device Frame -->
    <rect width="340" height="680" rx="48" fill="#1E293B" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <!-- Screen Bezel -->
    <rect x="10" y="10" width="320" height="660" rx="40" fill="#0B0F19"/>
    
    <!-- Dynamic Island / Notch -->
    <rect x="120" y="20" width="100" height="24" rx="12" fill="#000000"/>

    <!-- Screen Content: Mobile Dashboard -->
    <g transform="translate(26, 64)">
      <!-- Top Profile Pill -->
      <text x="0" y="18" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">ePRISE MOBILE</text>
      <text x="0" y="42" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">Apex Retailers</text>
      <circle cx="260" cy="30" r="16" fill="#1E293B"/>
      <text x="260" y="34" fill="#60A5FA" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">🔔</text>

      <!-- Daily Revenue Card -->
      <g transform="translate(0, 60)">
        <rect width="288" height="120" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.06)"/>
        <text x="18" y="28" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">TODAY'S INVOICING</text>
        <text x="18" y="66" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">₹2,84,500</text>
        <text x="18" y="96" fill="#10B981" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">↑ 18 Invoices created · ₹42,800 GST</text>
      </g>

      <!-- Quick Actions Grid (2x2) -->
      <g transform="translate(0, 200)">
        <text x="0" y="16" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">QUICK ACTIONS</text>
        
        <!-- Action 1: Create Invoice -->
        <g transform="translate(0, 28)">
          <rect width="138" height="80" rx="12" fill="#3B82F6" opacity="0.2" stroke="#3B82F6" stroke-width="1"/>
          <text x="16" y="34" fill="#38BDF8" font-size="18">🧾</text>
          <text x="16" y="60" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">New Invoice</text>
        </g>

        <!-- Action 2: Book Order -->
        <g transform="translate(150, 28)">
          <rect width="138" height="80" rx="12" fill="#1E293B"/>
          <text x="16" y="34" fill="#60A5FA" font-size="18">🛒</text>
          <text x="16" y="60" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Book Order</text>
        </g>

        <!-- Action 3: E-Way Bill -->
        <g transform="translate(0, 120)">
          <rect width="138" height="80" rx="12" fill="#1E293B"/>
          <text x="16" y="34" fill="#A855F7" font-size="18">🚚</text>
          <text x="16" y="60" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">E-Way Bill</text>
        </g>

        <!-- Action 4: Scan Stock -->
        <g transform="translate(150, 120)">
          <rect width="138" height="80" rx="12" fill="#1E293B"/>
          <text x="16" y="34" fill="#10B981" font-size="18">📦</text>
          <text x="16" y="60" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Stock Check</text>
        </g>
      </g>

      <!-- Bottom Nav Bar -->
      <g transform="translate(0, 520)">
        <rect width="288" height="54" rx="27" fill="#151D2A" stroke="rgba(255,255,255,0.08)"/>
        <text x="36" y="32" fill="#38BDF8" font-size="16" text-anchor="middle">🏠</text>
        <text x="108" y="32" fill="#64748B" font-size="16" text-anchor="middle">📄</text>
        <text x="180" y="32" fill="#64748B" font-size="16" text-anchor="middle">📦</text>
        <text x="252" y="32" fill="#64748B" font-size="16" text-anchor="middle">👤</text>
      </g>
    </g>
  </g>

  <!-- PHONE 2: RIGHT (WhatsApp Invoicing & Immediate Payment) -->
  <g transform="translate(660, 60)" filter="url(#phoneShadow)">
    <rect width="340" height="680" rx="48" fill="#1E293B" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <rect x="10" y="10" width="320" height="660" rx="40" fill="#0B0F19"/>
    
    <!-- Notch -->
    <rect x="120" y="20" width="100" height="24" rx="12" fill="#000000"/>

    <g transform="translate(26, 64)">
      <text x="0" y="18" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">INSTANT DISPATCH</text>
      <text x="0" y="42" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">GST Invoice Ready</text>
      
      <!-- Generated Invoice Preview Card -->
      <g transform="translate(0, 60)">
        <rect width="288" height="260" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.06)"/>
        
        <g transform="translate(18, 20)">
          <text x="0" y="16" fill="#10B981" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">✓ E-INVOICE GENERATED</text>
          <text x="0" y="44" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">#INV-2023-8941</text>
          <text x="0" y="64" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Om Logistics Corp · Surat</text>
          
          <line x1="0" y1="84" x2="252" y2="84" stroke="rgba(255,255,255,0.06)"/>

          <text x="0" y="112" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Taxable: ₹1,61,000</text>
          <text x="0" y="134" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12">IGST 18%: ₹28,980</text>
          <text x="0" y="164" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">Total: ₹1,89,980</text>

          <rect y="184" width="252" height="34" rx="8" fill="#25D366"/>
          <text x="126" y="206" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">💬 Share via WhatsApp</text>
        </g>
      </g>

      <!-- Customer Payment Link & QR -->
      <g transform="translate(0, 340)">
        <rect width="288" height="150" rx="16" fill="#151D2A" stroke="rgba(255,255,255,0.04)"/>
        <g transform="translate(18, 20)">
          <text x="0" y="16" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">UPI / RAZORPAY SMART LINK</text>
          <text x="0" y="40" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Direct Payment Link Active</text>
          <text x="0" y="60" fill="#64748B" font-family="monospace" font-size="11">pay.eprise.com/inv/8941</text>
          
          <rect y="80" width="252" height="36" rx="8" fill="#1E293B" stroke="rgba(255,255,255,0.08)"/>
          <text x="126" y="103" fill="#60A5FA" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Copy Payment Link</text>
        </g>
      </g>
    </g>
  </g>
</svg>

