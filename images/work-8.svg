<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1810"/>
      <stop offset="50%" stop-color="#1A0D08"/>
      <stop offset="100%" stop-color="#0E0704"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="800" fill="url(#bg8)"/>
  
  <circle cx="600" cy="350" r="380" fill="#D97706" opacity="0.12" filter="blur(110px)"/>

  <!-- Luxury Store Cover Visual -->
  <g transform="translate(100, 100)">
    <rect width="1000" height="600" rx="20" fill="#1C0F0A" stroke="rgba(217,119,6,0.2)"/>
    
    <!-- Store Header -->
    <text x="50" y="60" fill="#F7F4EC" font-family="'Youth', serif, sans-serif" font-size="20" font-weight="800" letter-spacing="3">BARAKHA</text>
    <text x="950" y="60" fill="#D97706" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="end">BAG (0)</text>
    <line x1="50" y1="85" x2="950" y2="85" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <text x="50" y="160" fill="#D97706" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="2">SUMMER SILKS &amp; WOVEN TEXTILES</text>
    <text x="50" y="240" fill="#F7F4EC" font-family="'Youth', serif, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">POETRY IN EVERY THREAD</text>

    <!-- Product Cards Duo -->
    <g transform="translate(50, 290)">
      <rect width="400" height="240" rx="16" fill="#2A160E" stroke="rgba(255,255,255,0.05)"/>
      <text x="30" y="140" fill="#F7F4EC" font-family="sans-serif" font-size="22" font-weight="800">Raw Silk Trench</text>
      <text x="30" y="180" fill="#D97706" font-family="sans-serif" font-size="16" font-weight="700">₹38,500</text>
    </g>

    <g transform="translate(480, 290)">
      <rect width="470" height="240" rx="16" fill="#2A160E" stroke="rgba(255,255,255,0.05)"/>
      <text x="30" y="140" fill="#F7F4EC" font-family="sans-serif" font-size="22" font-weight="800">Handwoven Artisanal Drape</text>
      <text x="30" y="180" fill="#D97706" font-family="sans-serif" font-size="16" font-weight="700">₹24,000</text>
    </g>
  </g>
</svg>
