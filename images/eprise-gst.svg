<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="gstBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#gstBg)"/>

  <!-- Background Lines -->
  <g stroke="rgba(255,255,255,0.02)" stroke-width="1">
    <path d="M0 100H1200 M0 200H1200 M0 300H1200 M0 400H1200 M0 500H1200 M0 600H1200 M0 700H1200"/>
    <path d="M150 0V800 M300 0V800 M450 0V800 M600 0V800 M750 0V800 M900 0V800 M1050 0V800"/>
  </g>

  <!-- Window Frame -->
  <g transform="translate(60, 40)">
    <rect width="1080" height="720" rx="16" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- Window top -->
    <rect width="1080" height="48" rx="16" fill="#1E293B"/>
    <rect y="36" width="1080" height="12" fill="#1E293B"/>
    <circle cx="28" cy="24" r="5" fill="#EF4444"/>
    <circle cx="44" cy="24" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="24" r="5" fill="#10B981"/>
    <text x="540" y="28" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">eprise.app/compliance/gst-reconciliation-portal</text>

    <!-- Header Section -->
    <g transform="translate(40, 76)">
      <text x="0" y="24" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">GST Compliance &amp; Input Tax Credit (ITC) Engine</text>
      <text x="0" y="46" fill="#64748B" font-family="-apple-system, sans-serif" font-size="13">Direct API sync with Goods &amp; Services Tax Network (GSTN) portal for automated GSTR-1, 2B &amp; 3B reconciliation.</text>

      <!-- Sync Status Badge -->
      <g transform="translate(860, 6)">
        <rect width="140" height="32" rx="16" fill="#10B981" opacity="0.15"/>
        <circle cx="20" cy="16" r="4" fill="#10B981"/>
        <text x="34" y="20" fill="#10B981" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">GSTN LIVE SYNCED</text>
      </g>
    </g>

    <!-- 3 Compliance Metric Cards -->
    <g transform="translate(40, 150)">
      <!-- Card 1: GSTR-1 -->
      <g transform="translate(0, 0)">
        <rect width="316" height="120" rx="12" fill="#151D2A" stroke="rgba(255,255,255,0.06)"/>
        <text x="20" y="32" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">GSTR-1 OUTWARD SUPPLIES</text>
        <text x="20" y="66" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">1,842 Invoices</text>
        <text x="20" y="94" fill="#10B981" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">✓ Uploaded &amp; E-Invoiced</text>
      </g>

      <!-- Card 2: GSTR-2B ITC Matching -->
      <g transform="translate(342, 0)">
        <rect width="316" height="120" rx="12" fill="#151D2A" stroke="rgba(255,255,255,0.06)"/>
        <text x="20" y="32" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">GSTR-2B ELIGIBLE ITC</text>
        <text x="20" y="66" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">₹21,44,200</text>
        <text x="20" y="94" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">99.8% Matched with Purchase Register</text>
      </g>

      <!-- Card 3: E-Way Bills Active -->
      <g transform="translate(684, 0)">
        <rect width="316" height="120" rx="12" fill="#151D2A" stroke="rgba(255,255,255,0.06)"/>
        <text x="20" y="32" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">ACTIVE E-WAY BILLS</text>
        <text x="20" y="66" fill="#A855F7" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">38 Consignments</text>
        <text x="20" y="94" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">2 In-transit expiring today</text>
      </g>
    </g>

    <!-- Reconciliation Matrix Comparison Table -->
    <g transform="translate(40, 296)">
      <rect width="1000" height="380" rx="14" fill="#151D2A" stroke="rgba(255,255,255,0.06)"/>
      
      <!-- Table Topbar -->
      <rect width="1000" height="46" rx="14" fill="#1E293B"/>
      <text x="24" y="28" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">RECONCILIATION SUMMARY (PURCHASE REGISTER vs GSTR-2B)</text>
      
      <g transform="translate(740, 8)">
        <rect width="110" height="30" rx="6" fill="#3B82F6"/>
        <text x="55" y="19" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Auto-Match All</text>
        
        <rect x="120" y="0" width="120" height="30" rx="6" fill="#1E293B" stroke="rgba(255,255,255,0.1)"/>
        <text x="180" y="19" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Export GSTR-3B</text>
      </g>

      <!-- Table Rows -->
      <!-- Row 1 -->
      <g transform="translate(24, 60)">
        <rect width="952" height="64" rx="8" fill="#1E293B" opacity="0.6"/>
        <text x="18" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Tata Steel Industrial Corp · GSTIN: 27AAACT2727Q1ZW</text>
        <text x="18" y="48" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Inv #TS-4921 · Date: 12-Oct-2023 · HSN 7208</text>
        <text x="620" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Books: ₹4,80,000</text>
        <text x="620" y="48" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11">2B Portal: ₹4,80,000</text>
        <rect x="840" y="18" width="94" height="26" rx="6" fill="#10B981" opacity="0.15"/>
        <text x="887" y="35" fill="#10B981" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">100% MATCHED</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(24, 136)">
        <rect width="952" height="64" rx="8" fill="#1E293B" opacity="0.6"/>
        <text x="18" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Schneider Electric India · GSTIN: 29AABCS1429G1Z8</text>
        <text x="18" y="48" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Inv #SE-8012 · Date: 14-Oct-2023 · HSN 8537</text>
        <text x="620" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Books: ₹1,45,200</text>
        <text x="620" y="48" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11">2B Portal: ₹1,45,200</text>
        <rect x="840" y="18" width="94" height="26" rx="6" fill="#10B981" opacity="0.15"/>
        <text x="887" y="35" fill="#10B981" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">100% MATCHED</text>
      </g>

      <!-- Row 3: ITC Warning/Mismatch -->
      <g transform="translate(24, 212)">
        <rect width="952" height="64" rx="8" fill="#1E293B" opacity="0.6" stroke="#F59E0B" stroke-width="1"/>
        <text x="18" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Universal Packaging Solutions · GSTIN: 27AABCU5821F1ZX</text>
        <text x="18" y="48" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="11">⚠️ Vendor filed late in GSTR-1 · Invoice date mismatch by 2 days</text>
        <text x="620" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Books: ₹38,400</text>
        <text x="620" y="48" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="11">Eligible in next period</text>
        <rect x="840" y="18" width="94" height="26" rx="6" fill="#F59E0B" opacity="0.15"/>
        <text x="887" y="35" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">NOTIFY VENDOR</text>
      </g>

      <!-- Bottom Summary Row -->
      <g transform="translate(24, 300)">
        <rect width="952" height="50" rx="8" fill="#111827"/>
        <text x="24" y="30" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Total Validated Input Tax Credit (ITC) for this filing cycle:</text>
        <text x="928" y="32" fill="#10B981" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="end">₹21,44,200.00 ✓</text>
      </g>
    </g>
  </g>
</svg>
