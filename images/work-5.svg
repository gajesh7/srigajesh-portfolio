<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="800" fill="url(#bg5)"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <path d="M0 100H1200 M0 200H1200 M0 300H1200 M0 400H1200 M0 500H1200 M0 600H1200 M0 700H1200" />
  </g>
  
  <circle cx="200" cy="200" r="300" fill="#10B981" opacity="0.1" filter="blur(90px)"/>

  <!-- Kanban Workflow Board Graphic -->
  <g transform="translate(100, 120)">
    <rect width="1000" height="560" rx="20" fill="#0F172A" stroke="rgba(255,255,255,0.08)"/>
    
    <!-- Topbar -->
    <rect width="1000" height="60" rx="20" fill="#1E293B"/>
    <text x="30" y="36" fill="#34D399" font-family="sans-serif" font-size="14" font-weight="800">⚡ TRIBAL / PRODUCTION BATCH #842</text>
    <rect x="800" y="16" width="160" height="28" rx="14" fill="#10B981" opacity="0.2"/>
    <text x="880" y="34" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">12,000 Units Active</text>

    <!-- Column 1 -->
    <g transform="translate(40, 90)">
      <rect width="280" height="430" rx="14" fill="#1E293B"/>
      <text x="20" y="35" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="700">FABRIC SOURCING (4)</text>
      <!-- Card 1 -->
      <rect x="15" y="55" width="250" height="100" rx="10" fill="#0F172A"/>
      <text x="30" y="85" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="800">PRIORITY</text>
      <text x="30" y="108" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="800">300 GSM Heavy Terry</text>
      <text x="30" y="130" fill="#64748B" font-family="sans-serif" font-size="11">Mill: KnitFab Coimbatore</text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(360, 90)">
      <rect width="280" height="430" rx="14" fill="#1E293B"/>
      <text x="20" y="35" fill="#60A5FA" font-family="sans-serif" font-size="12" font-weight="700">CUTTING &amp; BATCHING (2)</text>
      <!-- Card 2 Active -->
      <rect x="15" y="55" width="250" height="120" rx="10" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5"/>
      <text x="30" y="85" fill="#818CF8" font-family="sans-serif" font-size="10" font-weight="800">IN PROGRESS</text>
      <text x="30" y="108" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="800">Oversized Hoodies (L/XL)</text>
      <text x="30" y="130" fill="#A5B4FC" font-family="sans-serif" font-size="11">Laser Cutter #02 Active</text>
      <rect x="30" y="145" width="190" height="6" rx="3" fill="#312E81"/>
      <rect x="30" y="145" width="140" height="6" rx="3" fill="#6366F1"/>
    </g>

    <!-- Column 3 -->
    <g transform="translate(680, 90)">
      <rect width="280" height="430" rx="14" fill="#1E293B"/>
      <text x="20" y="35" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">QUALITY AUDIT (3)</text>
      <!-- Card 3 -->
      <rect x="15" y="55" width="250" height="100" rx="10" fill="#0F172A"/>
      <text x="30" y="85" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="800">QA PASSED</text>
      <text x="30" y="108" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="800">Embroidery &amp; Stitching</text>
      <text x="30" y="130" fill="#64748B" font-family="sans-serif" font-size="11">Defect Rate: 0.02%</text>
    </g>
  </g>
</svg>
